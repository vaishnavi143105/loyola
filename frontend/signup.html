<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MissVoice - Create Account</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0a0a0f;
            color: white;
        }

        .signup-container {
            width: 420px;
            padding: 40px;
            background: #12121a;
            border: 1px solid #292938;
            border-radius: 18px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        .logo {
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #00eaff;
        }

        .subtitle {
            text-align: center;
            color: #999;
            margin-bottom: 30px;
        }

        .input-box {
            margin-bottom: 18px;
        }

        .input-box label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            color: #ddd;
        }

        .input-box input {
            width: 100%;
            padding: 13px;
            border-radius: 8px;
            border: 1px solid #333342;
            background: #0d0d14;
            color: white;
            outline: none;
            font-size: 15px;
        }

        .input-box input:focus {
            border-color: #7c5cff;
        }

        .signup-btn {
            width: 100%;
            padding: 14px;
            margin-top: 8px;
            border: none;
            border-radius: 8px;
            background: #7c5cff;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .signup-btn:hover {
            background: #6848e8;
        }

        .signup-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .login-text {
            text-align: center;
            margin-top: 22px;
            color: #999;
        }

        .login-text a {
            color: #8d72ff;
            text-decoration: none;
            font-weight: bold;
        }

        .message {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            display: none;
        }

        .error {
            color: #ff6b6b;
        }

        .success {
            color: #4ade80;
        }

    </style>

</head>

<body>

<div class="signup-container">

    <div class="logo">
        MissVoice
    </div>

    <div class="subtitle">
        Create your account
    </div>

    <form id="signupForm">

        <!-- Full Name -->
        <div class="input-box">

            <label for="fullname">
                Full Name
            </label>

            <input
                type="text"
                id="fullname"
                placeholder="Enter your full name"
                autocomplete="name"
                required
            >

        </div>

        <!-- Email -->
        <div class="input-box">

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                autocomplete="email"
                required
            >

        </div>

        <!-- Phone -->
        <div class="input-box">

            <label for="phone">
                Phone Number
            </label>

            <input
                type="tel"
                id="phone"
                placeholder="Enter your phone number"
                autocomplete="tel"
                required
            >

        </div>

        <!-- Password -->
        <div class="input-box">

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Create a password"
                autocomplete="new-password"
                required
            >

        </div>

        <!-- Confirm Password -->
        <div class="input-box">

            <label for="confirmPassword">
                Confirm Password
            </label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm your password"
                autocomplete="new-password"
                required
            >

        </div>

        <!-- Create Account -->
        <button
            type="submit"
            class="signup-btn"
            id="signupBtn">

            Create Account

        </button>

        <div
            id="message"
            class="message">
        </div>

    </form>

    <div class="login-text">

        Already have an account?

        <a href="login.html">
            Login
        </a>

    </div>

</div>


<script>

/* =========================================================
   MISSVOICE API SERVER
   =========================================================

   IMPORTANT:

   Do NOT use 127.0.0.1 here when your friend is testing.

   127.0.0.1 means:
   "this same computer"

   Your laptop's Wi-Fi IP is:
   10.42.134.97

   Your friend's laptop can therefore reach your Flask
   server using this address.
========================================================= */

const API_URL = "http://10.42.134.97:5000";


/* =========================================================
   ELEMENTS
========================================================= */

const signupForm =
    document.getElementById("signupForm");

const signupBtn =
    document.getElementById("signupBtn");

const message =
    document.getElementById("message");


/* =========================================================
   SHOW MESSAGE
========================================================= */

function showMessage(text, type) {

    message.textContent = text;

    message.className =
        "message " + type;

    message.style.display =
        "block";
}


/* =========================================================
   SIGNUP
========================================================= */

signupForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        /* ---------------------------------------------
           GET FORM VALUES
        --------------------------------------------- */

        const fullname =
            document
                .getElementById("fullname")
                .value
                .trim();

        const email =
            document
                .getElementById("email")
                .value
                .trim()
                .toLowerCase();

        const phone =
            document
                .getElementById("phone")
                .value
                .trim();

        const password =
            document
                .getElementById("password")
                .value;

        const confirmPassword =
            document
                .getElementById("confirmPassword")
                .value;


        /* ---------------------------------------------
           VALIDATION
        --------------------------------------------- */

        if (!fullname) {

            showMessage(
                "Please enter your full name.",
                "error"
            );

            return;
        }


        if (!email) {

            showMessage(
                "Please enter your email.",
                "error"
            );

            return;
        }


        if (!phone) {

            showMessage(
                "Please enter your phone number.",
                "error"
            );

            return;
        }


        if (password.length < 6) {

            showMessage(
                "Password must contain at least 6 characters.",
                "error"
            );

            return;
        }


        if (password !== confirmPassword) {

            showMessage(
                "Passwords do not match!",
                "error"
            );

            return;
        }


        /* ---------------------------------------------
           DISABLE BUTTON
        --------------------------------------------- */

        signupBtn.disabled = true;

        signupBtn.textContent =
            "Creating Account...";


        showMessage(
            "Creating your account...",
            "success"
        );


        try {

            /* =========================================
               SEND DATA TO FLASK
            ========================================= */

            const response =
                await fetch(
                    `${API_URL}/api/signup`,
                    {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({

                            fullname: fullname,

                            email: email,

                            phone: phone,

                            password: password

                        })

                    }
                );


            /* =========================================
               READ RESPONSE
            ========================================= */

            const data =
                await response.json();


            console.log(
                "Signup response:",
                data
            );


            /* =========================================
               SUCCESS
            ========================================= */

            if (response.ok) {

                /*
                    IMPORTANT:

                    Save the user only after the
                    backend confirms that the account
                    was created.
                */

                if (data.user) {

                    localStorage.setItem(
                        "userId",
                        data.user.id
                    );

                    localStorage.setItem(
                        "userFullname",
                        data.user.fullname
                    );

                    localStorage.setItem(
                        "userEmail",
                        data.user.email
                    );

                    localStorage.setItem(
                        "userPhone",
                        data.user.phone
                    );

                    localStorage.setItem(
                        "currentUser",
                        JSON.stringify(
                            data.user
                        )
                    );

                }
                else {

                    /*
                        Your current backend may only
                        return:

                        {
                            "message":
                            "Account created successfully"
                        }

                        In that case store the entered
                        information temporarily.
                    */

                    localStorage.setItem(
                        "userFullname",
                        fullname
                    );

                    localStorage.setItem(
                        "userEmail",
                        email
                    );

                    localStorage.setItem(
                        "userPhone",
                        phone
                    );

                }


                showMessage(
                    "Account created successfully!",
                    "success"
                );


                signupForm.reset();


                /* -------------------------------------
                   GO TO LOGIN
                ------------------------------------- */

                setTimeout(
                    function() {

                        window.location.href =
                            "login.html";

                    },
                    1200
                );

            }


            /* =========================================
               SIGNUP FAILED
            ========================================= */

            else {

                showMessage(
                    data.message ||
                    "Signup failed.",
                    "error"
                );


                signupBtn.disabled = false;

                signupBtn.textContent =
                    "Create Account";

            }

        }


        /* =============================================
           SERVER CONNECTION ERROR
        ============================================= */

        catch (error) {

            console.error(
                "Signup connection error:",
                error
            );


            showMessage(
                "Cannot connect to MissVoice server. Check that Flask is running.",
                "error"
            );


            signupBtn.disabled = false;

            signupBtn.textContent =
                "Create Account";

        }

    }
);

</script>

</body>

</html>
