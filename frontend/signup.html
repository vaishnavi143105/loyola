<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MissVoice - Create Account</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0a0a0f;
            color: white;
        }

        .signup-container {
            width: 420px;
            padding: 40px;
            background: #12121a;
            border: 1px solid #292938;
            border-radius: 18px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        .logo {
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #999;
            margin-bottom: 30px;
        }

        .input-box {
            margin-bottom: 18px;
        }

        .input-box label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            color: #ddd;
        }

        .input-box input {
            width: 100%;
            padding: 13px;
            border-radius: 8px;
            border: 1px solid #333342;
            background: #0d0d14;
            color: white;
            outline: none;
            font-size: 15px;
        }

        .input-box input:focus {
            border-color: #7c5cff;
        }

        .signup-btn {
            width: 100%;
            padding: 14px;
            margin-top: 8px;
            border: none;
            border-radius: 8px;
            background: #7c5cff;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .signup-btn:hover {
            background: #6848e8;
        }

        .signup-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .login-text {
            text-align: center;
            margin-top: 22px;
            color: #999;
        }

        .login-text a {
            color: #8d72ff;
            text-decoration: none;
            font-weight: bold;
        }

        .message {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            display: none;
        }

        .error {
            color: #ff6b6b;
        }

        .success {
            color: #4ade80;
        }

    </style>

</head>


<body>


<div class="signup-container">

    <div class="logo">
        MissVoice
    </div>

    <div class="subtitle">
        Create your account
    </div>


    <form id="signupForm">


        <!-- Full Name -->

        <div class="input-box">

            <label for="fullname">
                Full Name
            </label>

            <input
                type="text"
                id="fullname"
                placeholder="Enter your full name"
                required>

        </div>


        <!-- Email -->

        <div class="input-box">

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required>

        </div>


        <!-- Phone -->

        <div class="input-box">

            <label for="phone">
                Phone Number
            </label>

            <input
                type="tel"
                id="phone"
                placeholder="Enter your phone number"
                required>

        </div>


        <!-- Password -->

        <div class="input-box">

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Create a password"
                required>

        </div>


        <!-- Confirm Password -->

        <div class="input-box">

            <label for="confirmPassword">
                Confirm Password
            </label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm your password"
                required>

        </div>


        <!-- Create Account -->

        <button
            type="submit"
            class="signup-btn"
            id="signupBtn">

            Create Account

        </button>


        <div
            id="message"
            class="message">
        </div>


    </form>


    <div class="login-text">

        Already have an account?

        <a href="login.html">
            Login
        </a>

    </div>


</div>



<script>


const signupForm =
    document.getElementById("signupForm");


const signupBtn =
    document.getElementById("signupBtn");


const message =
    document.getElementById("message");



signupForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const fullname =
            document
            .getElementById("fullname")
            .value
            .trim();


        const email =
            document
            .getElementById("email")
            .value
            .trim();


        const phone =
            document
            .getElementById("phone")
            .value
            .trim();


        const password =
            document
            .getElementById("password")
            .value;


        const confirmPassword =
            document
            .getElementById("confirmPassword")
            .value;



        // Password check

        if (password !== confirmPassword) {

            showMessage(
                "Passwords do not match!",
                "error"
            );

            return;
        }



        // Password length

        if (password.length < 6) {

            showMessage(
                "Password must contain at least 6 characters.",
                "error"
            );

            return;
        }



        signupBtn.disabled = true;

        signupBtn.textContent =
            "Creating Account...";



        try {


            const response =
                await fetch(
                    "http://127.0.0.1:5000/api/signup",
                    {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({

                            fullname: fullname,

                            email: email,

                            phone: phone,

                            password: password

                        })

                    }
                );



            const data =
                await response.json();



            console.log(
                "Backend response:",
                data
            );



            if (response.ok) {


                /*
                 * SAVE USER INFORMATION
                 *
                 * Dashboard can use this
                 */

                localStorage.setItem(
                    "userFullname",
                    fullname
                );


                localStorage.setItem(
                    "userEmail",
                    email
                );


                localStorage.setItem(
                    "userPhone",
                    phone
                );



                // Success message

                showMessage(
                    "Account created successfully!",
                    "success"
                );



                signupForm.reset();



                /*
                 * OPEN DASHBOARD
                 */

                setTimeout(function() {

                    window.location.href =
                        "dashboard.html";

                }, 1000);


            } else {


                showMessage(
                    data.message ||
                    "Signup failed.",
                    "error"
                );


                signupBtn.disabled = false;

                signupBtn.textContent =
                    "Create Account";

            }


        } catch (error) {


            console.error(
                "Signup connection error:",
                error
            );


            showMessage(
                "Unable to connect to MissVoice server. Please make sure Flask is running.",
                "error"
            );


            signupBtn.disabled = false;

            signupBtn.textContent =
                "Create Account";

        }

    }
);



function showMessage(text, type) {

    message.textContent = text;

    message.className =
        "message " + type;

    message.style.display =
        "block";

}


</script>


</body>

</html>
