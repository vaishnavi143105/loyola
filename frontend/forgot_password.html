<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MissVoice | Forgot Password</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    background:linear-gradient(135deg,#050816,#0d1638,#090d1d);
    overflow:hidden;
}

body::before{
    content:"";
    position:absolute;
    width:450px;
    height:450px;
    background:#00eaff;
    border-radius:50%;
    filter:blur(150px);
    top:-120px;
    left:-120px;
    opacity:.35;
}

body::after{
    content:"";
    position:absolute;
    width:450px;
    height:450px;
    background:#7b2ff7;
    border-radius:50%;
    filter:blur(150px);
    bottom:-120px;
    right:-120px;
    opacity:.35;
}

.container{
    width:420px;
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(20px);
    border-radius:20px;
    padding:40px;
    color:white;
    position:relative;
    z-index:1;
    box-shadow:0 0 30px rgba(0,234,255,.25);
}

h1{
    color:#00eaff;
    text-align:center;
    margin-bottom:10px;
}

p{
    text-align:center;
    color:#ddd;
    margin-bottom:25px;
}

.input-box{
    margin-bottom:20px;
}

.input-box label{
    display:block;
    margin-bottom:8px;
}

.input-box input{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    outline:none;
    background:rgba(255,255,255,.08);
    color:white;
}

.input-box input::placeholder{
    color:#bbb;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:12px;
    background:#00eaff;
    color:black;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    box-shadow:0 0 20px #00eaff;
}

.message{
    text-align:center;
    margin-top:20px;
    color:#00ff99;
}

.back{
    text-align:center;
    margin-top:20px;
}

.back a{
    color:#00eaff;
    text-decoration:none;
    font-weight:bold;
}

</style>

</head>

<body>

<div class="container">

<h1>Forgot Password</h1>

<p>
Enter your registered email address.
</p>

<form id="forgotForm">

<div class="input-box">

<label>Email Address</label>

<input
type="email"
id="email"
placeholder="Enter your email"
required>

</div>

<button type="submit">

Send Reset Link

</button>

</form>

<div class="message" id="message"></div>

<div class="back">

<a href="login.html">

← Back to Login

</a>

</div>

</div>

<script>

const form = document.getElementById("forgotForm");

form.addEventListener("submit",function(e){

    e.preventDefault();

    const email = document.getElementById("email").value;

    if(email==""){

        alert("Please enter your email.");

        return;

    }

    document.getElementById("message").innerHTML =
    "Password reset link sent successfully!";

});

</script>

</body>
</html>
