<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>MissVoice Dashboard</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Segoe UI", sans-serif;
}

body {

    min-height: 100vh;

    background:
        linear-gradient(
            135deg,
            #071427,
            #12254d,
            #080d1d
        );

    color: white;
}


/* =========================================================
   HEADER
========================================================= */

header {

    display: flex;

    justify-content: space-between;

    align-items: center;

    padding: 18px 30px;

    background:
        rgba(255,255,255,.06);

    backdrop-filter: blur(15px);

    border-bottom:
        1px solid rgba(255,255,255,.1);
}

.logo {

    font-size: 30px;

    font-weight: 700;

    color: #3ddcff;
}


/* =========================================================
   SEARCH
========================================================= */

.search {

    display: flex;

    gap: 10px;
}

.search input {

    width: 280px;

    padding: 12px 16px;

    border: none;

    outline: none;

    border-radius: 25px;

    background: white;

    color: black;
}

button {

    padding: 10px 18px;

    border: none;

    border-radius: 25px;

    background: #3ddcff;

    color: black;

    font-weight: 700;

    cursor: pointer;
}

button:hover {

    transform: translateY(-1px);

    box-shadow:
        0 0 15px rgba(61,220,255,.5);
}


/* =========================================================
   MAIN
========================================================= */

main {

    display: grid;

    grid-template-columns:
        320px 1fr;

    gap: 20px;

    padding: 25px;
}


/* =========================================================
   CARDS
========================================================= */

.panel,
.card {

    background:
        rgba(255,255,255,.06);

    border:
        1px solid rgba(255,255,255,.08);

    padding: 22px;

    border-radius: 18px;

    backdrop-filter: blur(15px);
}


/* =========================================================
   PROFILE
========================================================= */

.center {

    text-align: center;
}

.avatar {

    width: 90px;

    height: 90px;

    margin:
        0 auto 15px;

    border-radius: 50%;

    display: flex;

    align-items: center;

    justify-content: center;

    background: #3ddcff;

    color: #06101f;

    font-size: 38px;

    font-weight: 700;
}


/* =========================================================
   CONNECTED USERS
========================================================= */

.connected-title {

    margin-top: 25px;

    text-align: left;
}

.user {

    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 10px;

    background:
        #18345f;

    padding: 12px;

    border-radius: 12px;

    margin-top: 10px;

    text-align: left;
}

.user-name {

    font-weight: 600;

    overflow: hidden;

    text-overflow: ellipsis;
}

.user-actions {

    display: flex;

    gap: 5px;
}

.user-actions button {

    padding:
        7px 10px;

    font-size: 12px;
}

.call-btn {

    background: #7b2ff7;

    color: white;
}

.delete-btn {

    background: #ff5c5c;

    color: white;
}


/* =========================================================
   SEARCH RESULT
========================================================= */

.result-user {

    background:
        rgba(255,255,255,.08);

    padding: 15px;

    border-radius: 12px;

    margin-top: 10px;

    display: flex;

    justify-content: space-between;

    align-items: center;
}

.empty {

    padding: 18px;

    border:
        2px dashed rgba(255,255,255,.2);

    border-radius: 12px;

    color: #aaa;

    text-align: center;

    margin-top: 15px;
}


/* =========================================================
   REQUEST NOTIFICATION
========================================================= */

.notification-box {

    display: none;

    background:
        rgba(0,234,255,.08);

    border:
        1px solid #3ddcff;

    padding: 18px;

    border-radius: 15px;

    margin-bottom: 20px;
}

.notification-header {

    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 12px;
}

.notification-header h3 {

    color: #3ddcff;
}

.request {

    background:
        rgba(255,255,255,.08);

    padding: 12px;

    border-radius: 12px;

    margin-top: 10px;

    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 10px;
}

.request-buttons {

    display: flex;

    gap: 7px;
}

.accept {

    background: #00e676;

    color: black;
}

.reject {

    background: #ff5252;

    color: white;
}


/* =========================================================
   SEARCH ACTIONS
========================================================= */

.actions {

    display: flex;

    gap: 12px;

    margin-top: 20px;
}


/* =========================================================
   LOGOUT
========================================================= */

.logout {

    background: #ff5252;

    color: white;

    padding:
        8px 15px;

    font-size: 13px;
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:900px) {

    main {

        grid-template-columns: 1fr;
    }

}

@media(max-width:600px) {

    header {

        flex-direction: column;

        gap: 15px;
    }

    .search {

        width: 100%;
    }

    .search input {

        width: 100%;
    }

    .user,
    .result-user,
    .request {

        flex-direction: column;

        align-items: stretch;
    }

}

</style>

</head>


<body>


<!-- ========================================================
     HEADER
========================================================= -->

<header>

    <div class="logo">
        MissVoice
    </div>

    <div class="search">

        <input
            id="searchName"
            type="text"
            placeholder="Search username"
        >

        <button onclick="searchUser()">
            Search
        </button>

    </div>

    <button
        class="logout"
        onclick="logout()"
    >
        Logout
    </button>

</header>


<!-- ========================================================
     MAIN
========================================================= -->

<main>


<!-- ========================================================
     LEFT PANEL
========================================================= -->

<div class="panel center">


    <div
        class="avatar"
        id="avatar"
    >
        U
    </div>


    <h2 id="profileName">
        User
    </h2>


    <p
        id="profileEmail"
        style="color:#aaa;margin-top:5px"
    >
        -
    </p>


    <!-- CONNECTED USERS -->

    <h3 class="connected-title">
        Connected Users
    </h3>


    <div id="connectedUsers">

        <div class="empty">
            No connected users
        </div>

    </div>


</div>


<!-- ========================================================
     RIGHT PANEL
========================================================= -->

<div>


    <!-- ====================================================
         CONNECTION NOTIFICATIONS
    ===================================================== -->

    <div
        class="notification-box"
        id="notificationBox"
    >

        <div class="notification-header">

            <h3>
                🔔 Connection Requests
            </h3>

            <span id="notificationCount">
                0
            </span>

        </div>


        <div id="requestList"></div>

    </div>


    <!-- ====================================================
         WELCOME
    ===================================================== -->

    <div class="card">

        <h2>
            Welcome,
            <span id="welcomeName">
                User
            </span>
        </h2>

        <p style="color:#bbb;margin-top:8px">

            Search for another MissVoice user
            and send a connection request.

            After they accept, you can chat
            and video call.

        </p>

    </div>


    <!-- ====================================================
         SEARCH RESULT
    ===================================================== -->

    <div
        class="card"
        style="margin-top:20px"
    >

        <h2>
            Search Result
        </h2>


        <div
            id="result"
            class="empty"
        >

            Search for a username to connect.

        </div>

    </div>


</div>


</main>


<script>


// ==========================================================
// BACKEND URL
// ==========================================================

const API_BASE =
    "http://10.42.134.97:5000/api";


// ==========================================================
// CURRENT USER
// ==========================================================

const currentUser =
    JSON.parse(
        localStorage.getItem("currentUser")
    );


if (!currentUser) {

    alert(
        "Please login first."
    );

    window.location.href =
        "login.html";
}


// ==========================================================
// DISPLAY PROFILE
// ==========================================================

if (currentUser) {

    document.getElementById(
        "profileName"
    ).textContent =
        currentUser.fullname;


    document.getElementById(
        "welcomeName"
    ).textContent =
        currentUser.fullname;


    document.getElementById(
        "profileEmail"
    ).textContent =
        currentUser.email;


    document.getElementById(
        "avatar"
    ).textContent =
        currentUser.fullname
            .charAt(0)
            .toUpperCase();

}


// ==========================================================
// SEARCH USER
// ==========================================================

async function searchUser() {

    const username =
        document
            .getElementById("searchName")
            .value
            .trim();


    const result =
        document.getElementById("result");


    if (!username) {

        result.innerHTML =
            "Please enter a username.";

        result.className =
            "empty";

        return;
    }


    try {

        const response =
            await fetch(
                `${API_BASE}/search-user?username=${encodeURIComponent(username)}&current_user_id=${currentUser.id}`
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            result.innerHTML =
                data.message ||
                "Search failed.";

            return;
        }


        if (
            !data.users ||
            data.users.length === 0
        ) {

            result.innerHTML =
                "No user found.";

            result.className =
                "empty";

            return;
        }


        result.className = "";


        result.innerHTML = "";


        data.users.forEach(
            user => {

                const div =
                    document.createElement(
                        "div"
                    );

                div.className =
                    "result-user";


                div.innerHTML = `
                    <div>
                        <strong>
                            ${escapeHtml(user.fullname)}
                        </strong>

                        <br>

                        <small style="color:#aaa">
                            ${escapeHtml(user.email)}
                        </small>
                    </div>

                    <button
                        onclick="sendConnection(${user.id})"
                    >
                        ➕ Connect
                    </button>
                `;


                result.appendChild(div);

            }
        );

    }

    catch (error) {

        console.error(error);

        result.innerHTML =
            "Cannot connect to backend.";

        result.className =
            "empty";
    }

}


// ==========================================================
// SEND CONNECTION
// ==========================================================

async function sendConnection(
    receiverId
) {

    try {

        const response =
            await fetch(
                `${API_BASE}/connect`,
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            sender_id:
                                currentUser.id,

                            receiver_id:
                                receiverId

                        })
                }
            );


        const data =
            await response.json();


        alert(
            data.message
        );


    }

    catch (error) {

        console.error(error);

        alert(
            "Could not send connection request."
        );
    }

}


// ==========================================================
// LOAD CONNECTION REQUESTS
// ==========================================================

async function loadRequests() {

    try {

        const response =
            await fetch(
                `${API_BASE}/connection-requests/${currentUser.id}`
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            return;
        }


        const box =
            document.getElementById(
                "notificationBox"
            );


        const list =
            document.getElementById(
                "requestList"
            );


        const count =
            document.getElementById(
                "notificationCount"
            );


        if (
            !data.requests ||
            data.requests.length === 0
        ) {

            box.style.display =
                "none";

            return;
        }


        box.style.display =
            "block";


        count.textContent =
            data.requests.length;


        list.innerHTML = "";


        data.requests.forEach(
            request => {

                const div =
                    document.createElement(
                        "div"
                    );

                div.className =
                    "request";


                div.innerHTML = `

                    <div>

                        <strong>
                            ${escapeHtml(request.fullname)}
                        </strong>

                        <br>

                        <small style="color:#aaa">
                            wants to connect with you
                        </small>

                    </div>


                    <div class="request-buttons">

                        <button
                            class="accept"
                            onclick="acceptRequest(${request.id})"
                        >
                            ✓ Accept
                        </button>


                        <button
                            class="reject"
                            onclick="rejectRequest(${request.id})"
                        >
                            ✕ Reject
                        </button>

                    </div>
                `;


                list.appendChild(div);

            }
        );

    }

    catch (error) {

        console.error(
            "Request loading error:",
            error
        );

    }

}


// ==========================================================
// ACCEPT REQUEST
// ==========================================================

async function acceptRequest(
    requestId
) {

    try {

        const response =
            await fetch(
                `${API_BASE}/connection-request/${requestId}/accept`,
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            user_id:
                                currentUser.id

                        })
                }
            );


        const data =
            await response.json();


        alert(
            data.message
        );


        if (data.success) {

            loadRequests();

            loadConnectedUsers();

        }

    }

    catch (error) {

        console.error(error);

        alert(
            "Could not accept request."
        );

    }

}


// ==========================================================
// REJECT REQUEST
// ==========================================================

async function rejectRequest(
    requestId
) {

    try {

        const response =
            await fetch(
                `${API_BASE}/connection-request/${requestId}/reject`,
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            user_id:
                                currentUser.id

                        })
                }
            );


        const data =
            await response.json();


        alert(
            data.message
        );


        if (data.success) {

            loadRequests();

        }

    }

    catch (error) {

        console.error(error);

        alert(
            "Could not reject request."
        );

    }

}


// ==========================================================
// LOAD CONNECTED USERS
// ==========================================================

async function loadConnectedUsers() {

    try {

        const response =
            await fetch(
                `${API_BASE}/connected-users/${currentUser.id}`
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            return;
        }


        const container =
            document.getElementById(
                "connectedUsers"
            );


        container.innerHTML = "";


        if (
            !data.users ||
            data.users.length === 0
        ) {

            container.innerHTML = `
                <div class="empty">
                    No connected users
                </div>
            `;

            return;
        }


        data.users.forEach(
            user => {

                const div =
                    document.createElement(
                        "div"
                    );


                div.className =
                    "user";


                div.innerHTML = `

                    <div class="user-name">

                        ${escapeHtml(
                            user.fullname
                        )}

                    </div>


                    <div class="user-actions">

                        <button
                            onclick="openChat(${user.id})"
                        >
                            💬
                        </button>


                        <button
                            class="call-btn"
                            onclick="openVideoCall(${user.id})"
                        >
                            📹
                        </button>

                    </div>

                `;


                container.appendChild(
                    div
                );

            }
        );

    }

    catch (error) {

        console.error(
            "Connected users error:",
            error
        );

    }

}


// ==========================================================
// OPEN CHAT
// ==========================================================

function openChat(
    userId
) {

    localStorage.setItem(
        "chatUserId",
        userId
    );


    window.location.href =
        "chat.html";

}


// ==========================================================
// OPEN VIDEO CALL
// ==========================================================

function openVideoCall(
    userId
) {

    localStorage.setItem(
        "callUserId",
        userId
    );


    window.location.href =
        "videocall.html";

}


// ==========================================================
// LOGOUT
// ==========================================================

function logout() {

    localStorage.removeItem(
        "userId"
    );

    localStorage.removeItem(
        "userFullname"
    );

    localStorage.removeItem(
        "userEmail"
    );

    localStorage.removeItem(
        "currentUser"
    );


    window.location.href =
        "login.html";

}


// ==========================================================
// BASIC HTML ESCAPE
// ==========================================================

function escapeHtml(
    value
) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        value ?? "";


    return div.innerHTML;

}


// ==========================================================
// INITIAL LOAD
// ==========================================================

if (currentUser) {

    loadRequests();

    loadConnectedUsers();

}


// ==========================================================
// AUTOMATIC NOTIFICATION CHECK
// ==========================================================

setInterval(
    function() {

        if (currentUser) {

            loadRequests();

        }

    },
    5000
);


// ==========================================================
// AUTOMATIC CONNECTED USER REFRESH
// ==========================================================

setInterval(
    function() {

        if (currentUser) {

            loadConnectedUsers();

        }

    },
    10000
);

</script>


</body>

</html>
