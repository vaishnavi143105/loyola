<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MissVoice | Login</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {

            background:
                linear-gradient(
                    135deg,
                    #050816,
                    #0d1638,
                    #090d1d
                );

            display: flex;

            justify-content: center;

            align-items: center;

            min-height: 100vh;

            overflow: hidden;
        }

        body::before {

            content: "";

            position: absolute;

            width: 450px;

            height: 450px;

            background: #00eaff;

            border-radius: 50%;

            filter: blur(150px);

            top: -120px;

            left: -120px;

            opacity: .4;
        }

        body::after {

            content: "";

            position: absolute;

            width: 450px;

            height: 450px;

            background: #7b2ff7;

            border-radius: 50%;

            filter: blur(150px);

            bottom: -120px;

            right: -120px;

            opacity: .4;
        }

        .container {

            position: relative;

            width: 400px;

            background:
                rgba(255, 255, 255, .06);

            border:
                1px solid rgba(255, 255, 255, .12);

            backdrop-filter: blur(20px);

            border-radius: 20px;

            padding: 40px;

            z-index: 2;

            box-shadow:
                0 0 35px rgba(0, 234, 255, .25);
        }

        .logo {

            text-align: center;

            font-size: 38px;

            color: #00eaff;

            font-weight: 700;

            margin-bottom: 10px;
        }

        h2 {

            text-align: center;

            margin-bottom: 30px;

            font-weight: 500;

            color: white;
        }

        .input-box {

            margin-bottom: 20px;
        }

        .input-box label {

            color: #ddd;

            font-size: 15px;

            display: block;

            margin-bottom: 8px;
        }

        .input-box input {

            width: 100%;

            padding: 14px;

            border: none;

            outline: none;

            border-radius: 10px;

            background:
                rgba(255, 255, 255, .08);

            color: white;

            font-size: 15px;
        }

        .input-box input:focus {

            box-shadow:
                0 0 0 1px #00eaff;
        }

        .input-box input::placeholder {

            color: #aaa;
        }

        .options {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 25px;

            font-size: 14px;
        }

        .options a {

            color: #00eaff;

            text-decoration: none;
        }

        .options a:hover {

            text-decoration: underline;
        }

        .options label {

            color: white;

            display: flex;

            align-items: center;

            gap: 5px;
        }

        button {

            width: 100%;

            padding: 15px;

            border: none;

            border-radius: 12px;

            background: #00eaff;

            color: black;

            font-size: 17px;

            font-weight: 600;

            cursor: pointer;

            transition: .3s;
        }

        button:hover {

            transform: translateY(-3px);

            box-shadow:
                0 0 20px #00eaff;
        }

        button:disabled {

            opacity: .6;

            cursor: not-allowed;

            transform: none;

            box-shadow: none;
        }

        .signup {

            margin-top: 25px;

            text-align: center;

            color: white;
        }

        .signup a {

            color: #00eaff;

            text-decoration: none;

            font-weight: 600;
        }

        .signup a:hover {

            text-decoration: underline;
        }

        #message {

            margin-top: 15px;

            text-align: center;

            font-size: 14px;

            min-height: 22px;
        }

        .loading {

            display: inline-block;

            width: 15px;

            height: 15px;

            border:
                2px solid rgba(0,0,0,.3);

            border-top-color: #000;

            border-radius: 50%;

            animation:
                spin .7s linear infinite;

            vertical-align: middle;

            margin-right: 7px;
        }

        @keyframes spin {

            to {

                transform: rotate(360deg);

            }

        }

        @media(max-width:500px) {

            .container {

                width: 92%;

                padding: 30px;

            }

        }

    </style>

</head>


<body>


<div class="container">


    <!-- LOGO -->

    <div class="logo">

        MissVoice

    </div>


    <!-- TITLE -->

    <h2>

        Login

    </h2>


    <!-- LOGIN FORM -->

    <form id="loginForm">


        <!-- EMAIL -->

        <div class="input-box">

            <label for="email">

                Email

            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                autocomplete="email"
                required
            >

        </div>


        <!-- PASSWORD -->

        <div class="input-box">

            <label for="password">

                Password

            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >

        </div>


        <!-- OPTIONS -->

        <div class="options">

            <label>

                <input
                    type="checkbox"
                    id="rememberMe"
                >

                Remember Me

            </label>


            <a href="forgot_password.html">

                Forgot Password?

            </a>

        </div>


        <!-- LOGIN BUTTON -->

        <button
            type="submit"
            id="loginButton"
        >

            Login

        </button>


    </form>


    <!-- MESSAGE -->

    <div id="message"></div>


    <!-- SIGNUP -->

    <div class="signup">

        Don't have an account?

        <a href="signup.html">

            Sign Up

        </a>

    </div>


</div>


<script>

/* ============================================================
   MISSVOICE API CONFIGURATION
   ============================================================

   YOUR LAPTOP:
   10.42.134.97

   FLASK:
   5000

   Therefore:

   http://10.42.134.97:5000

   Your friend must use the same Wi-Fi/hotspot network.

   DO NOT USE:

   http://127.0.0.1:5000

   on your friend's laptop.

============================================================ */

const API_BASE_URL =
    "http://10.42.134.97:5000/api";


/* ============================================================
   ELEMENTS
============================================================ */

const loginForm =
    document.getElementById("loginForm");

const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");

const rememberMe =
    document.getElementById("rememberMe");

const loginButton =
    document.getElementById("loginButton");

const message =
    document.getElementById("message");


/* ============================================================
   SHOW MESSAGE
============================================================ */

function showMessage(text, color) {

    message.textContent = text;

    message.style.color = color;

}


/* ============================================================
   CLEAR OLD USER SESSION
============================================================

   This is done when login page opens.

   It prevents an old user's information from
   appearing before a new login.

============================================================ */

localStorage.removeItem("userId");

localStorage.removeItem("userFullname");

localStorage.removeItem("userEmail");

localStorage.removeItem("userPhone");

localStorage.removeItem("currentUser");


/* ============================================================
   LOAD REMEMBERED EMAIL
============================================================ */

const savedEmail =
    localStorage.getItem("rememberedEmail");


if (savedEmail) {

    emailInput.value =
        savedEmail;

    rememberMe.checked =
        true;

}


/* ============================================================
   LOGIN FORM
============================================================ */

loginForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        /* ----------------------------------------------------
           GET VALUES
        ---------------------------------------------------- */

        const email =
            emailInput.value
                .trim()
                .toLowerCase();


        const password =
            passwordInput.value;


        /* ----------------------------------------------------
           VALIDATION
        ---------------------------------------------------- */

        if (!email || !password) {

            showMessage(
                "Please enter Email and Password.",
                "#ff6b6b"
            );

            return;

        }


        /* ----------------------------------------------------
           DISABLE LOGIN BUTTON
        ---------------------------------------------------- */

        loginButton.disabled = true;

        loginButton.innerHTML = `
            <span class="loading"></span>
            Logging in...
        `;


        showMessage(
            "Checking your account...",
            "#00eaff"
        );


        try {


            /* =================================================
               SEND LOGIN REQUEST
            ================================================= */

            const response =
                await fetch(
                    `${API_BASE_URL}/login`,
                    {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify({

                                email:
                                    email,

                                password:
                                    password

                            })

                    }
                );


            /* =================================================
               READ RESPONSE
            ================================================= */

            let data;

            try {

                data =
                    await response.json();

            }
            catch {

                throw new Error(
                    "Server returned an invalid response."
                );

            }


            console.log(
                "Login response:",
                data
            );


            /* =================================================
               LOGIN SUCCESS
            ================================================= */

            if (
                response.ok &&
                data.success
            ) {


                const user =
                    data.user;


                /* ------------------------------------------------
                   CHECK USER DATA
                ------------------------------------------------ */

                if (!user || !user.id) {

                    showMessage(
                        "Login successful, but user information was not returned.",
                        "#ff6b6b"
                    );

                    loginButton.disabled =
                        false;

                    loginButton.textContent =
                        "Login";

                    return;

                }


                /* =================================================
                   SAVE USER ID
                   IMPORTANT FOR CONNECT SYSTEM
                ================================================= */

                localStorage.setItem(
                    "userId",
                    String(user.id)
                );


                /* =================================================
                   SAVE FULL NAME
                ================================================= */

                localStorage.setItem(
                    "userFullname",
                    user.fullname || ""
                );


                /* =================================================
                   SAVE EMAIL
                ================================================= */

                localStorage.setItem(
                    "userEmail",
                    user.email || email
                );


                /* =================================================
                   SAVE PHONE
                ================================================= */

                localStorage.setItem(
                    "userPhone",
                    user.phone || ""
                );


                /* =================================================
                   SAVE COMPLETE CURRENT USER
                ================================================= */

                localStorage.setItem(
                    "currentUser",

                    JSON.stringify({

                        id:
                            user.id,

                        fullname:
                            user.fullname || "",

                        email:
                            user.email || email,

                        phone:
                            user.phone || ""

                    })
                );


                /* =================================================
                   REMEMBER EMAIL
                ================================================= */

                if (rememberMe.checked) {

                    localStorage.setItem(
                        "rememberedEmail",
                        email
                    );

                }
                else {

                    localStorage.removeItem(
                        "rememberedEmail"
                    );

                }


                /* =================================================
                   SUCCESS MESSAGE
                ================================================= */

                showMessage(
                    "Login Successful!",
                    "#00ff99"
                );


                /* =================================================
                   REDIRECT DASHBOARD
                ================================================= */

                setTimeout(
                    function() {

                        window.location.href =
                            "dashboard.html";

                    },
                    800
                );


            }


            /* =================================================
               LOGIN FAILED
            ================================================= */

            else {


                const errorMessage =
                    data.message ||
                    data.error ||
                    "Invalid email or password.";


                showMessage(
                    errorMessage,
                    "#ff6b6b"
                );


                loginButton.disabled =
                    false;


                loginButton.textContent =
                    "Login";

            }

        }


        /* =====================================================
           CONNECTION ERROR
        ===================================================== */

        catch (error) {


            console.error(
                "Login error:",
                error
            );


            showMessage(
                "Cannot connect to MissVoice server. Check that Flask is running and both devices are on the same network.",
                "#ff6b6b"
            );


            loginButton.disabled =
                false;


            loginButton.textContent =
                "Login";

        }

    }
);

</script>


</body>

</html>
