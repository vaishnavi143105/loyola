<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="MissVoice 3.0 Chat — real-time messaging with your friends.">
    <title>Chat — MissVoice 3.0</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-tertiary: #1a1a28;
            --bg-card: rgba(255,255,255,0.04);
            --bg-card-hover: rgba(255,255,255,0.08);
            --glass-border: rgba(255,255,255,0.08);
            --glass-border-hover: rgba(255,255,255,0.15);
            --text-primary: #f0f0f5;
            --text-secondary: #8888a0;
            --text-muted: #55556a;
            --accent-purple: #8b5cf6;
            --accent-purple-glow: rgba(139,92,246,0.35);
            --accent-blue: #3b82f6;
            --accent-cyan: #06b6d4;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-orange: #f59e0b;
            --gradient-hero: linear-gradient(135deg, #8b5cf6 0%, #3b82f6 50%, #06b6d4 100%);
            --msg-sent-bg: rgba(139,92,246,0.18);
            --msg-sent-border: rgba(139,92,246,0.25);
            --msg-recv-bg: rgba(255,255,255,0.05);
            --msg-recv-border: rgba(255,255,255,0.08);
            --sidebar-width: 360px;
            --radius-sm: 8px;
            --radius-md: 14px;
            --radius-lg: 20px;
            --radius-xl: 28px;
            --transition-fast: 0.2s cubic-bezier(0.4,0,0.2,1);
            --transition-smooth: 0.4s cubic-bezier(0.4,0,0.2,1);
        }

        html { font-size: 16px; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary); color: var(--text-primary);
            overflow: hidden; height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        a { text-decoration: none; color: inherit; }

        /* ============================== */
        /*  CHAT LAYOUT                   */
        /* ============================== */
        .chat-app {
            display: flex; height: 100vh; width: 100%;
        }

        /* ============================== */
        /*  LEFT PANEL — Conversation List*/
        /* ============================== */
        .chat-sidebar {
            width: var(--sidebar-width); height: 100vh;
            background: rgba(12,12,18,0.95);
            backdrop-filter: blur(20px);
            border-right: 1px solid var(--glass-border);
            display: flex; flex-direction: column;
            flex-shrink: 0;
            transition: transform var(--transition-smooth);
        }

        /* Sidebar Header */
        .cs-header {
            padding: 18px 20px;
            border-bottom: 1px solid var(--glass-border);
            display: flex; align-items: center; justify-content: space-between;
        }

        .cs-header-left {
            display: flex; align-items: center; gap: 12px;
        }

        .cs-back {
            width: 36px; height: 36px; border-radius: 50%;
            background: var(--bg-card); border: 1px solid var(--glass-border);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: var(--transition-fast); color: var(--text-secondary);
        }

        .cs-back:hover { background: var(--bg-card-hover); color: var(--text-primary); }
        .cs-back .material-icons-round { font-size: 20px; }

        .cs-header h1 { font-size: 1.2rem; font-weight: 700; letter-spacing: -0.3px; }

        .cs-header-actions { display: flex; gap: 6px; }

        .cs-action-btn {
            width: 36px; height: 36px; border-radius: 50%;
            background: var(--bg-card); border: 1px solid var(--glass-border);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: var(--transition-fast); color: var(--text-secondary);
        }

        .cs-action-btn:hover { background: var(--bg-card-hover); color: var(--text-primary); }
        .cs-action-btn .material-icons-round { font-size: 20px; }

        /* Search */
        .cs-search {
            padding: 12px 18px; border-bottom: 1px solid var(--glass-border);
        }

        .cs-search-wrap {
            position: relative; display: flex; align-items: center;
        }

        .cs-search-wrap .material-icons-round {
            position: absolute; left: 12px; font-size: 18px;
            color: var(--text-muted); pointer-events: none;
        }

        .cs-search-wrap input {
            width: 100%; padding: 10px 14px 10px 38px;
            background: var(--bg-card); border: 1px solid var(--glass-border);
            border-radius: var(--radius-md); color: var(--text-primary);
            font-family: 'Inter', sans-serif; font-size: 0.85rem;
            outline: none; transition: var(--transition-fast);
        }

        .cs-search-wrap input::placeholder { color: var(--text-muted); }
        .cs-search-wrap input:focus { border-color: var(--accent-purple); box-shadow: 0 0 0 2px rgba(139,92,246,0.1); }

        /* Conversation List */
        .cs-list { flex: 1; overflow-y: auto; padding: 6px 0; }

        .cs-list::-webkit-scrollbar { width: 4px; }
        .cs-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 4px; }

        .conv-item {
            display: flex; align-items: center; gap: 12px;
            padding: 14px 20px; cursor: pointer;
            transition: var(--transition-fast);
            position: relative;
        }

        .conv-item:hover { background: var(--bg-card); }
        .conv-item.active { background: rgba(139,92,246,0.08); border-right: 3px solid var(--accent-purple); }

        .conv-avatar {
            width: 48px; height: 48px; border-radius: 50%;
            background: var(--gradient-hero);
            display: flex; align-items: center; justify-content: center;
            font-size: 1rem; font-weight: 700; color: #fff;
            flex-shrink: 0; position: relative;
        }

        .conv-avatar .online-dot {
            position: absolute; bottom: 1px; right: 1px;
            width: 12px; height: 12px; border-radius: 50%;
            border: 2.5px solid var(--bg-primary);
        }

        .conv-avatar .online-dot.online { background: var(--accent-green); }
        .conv-avatar .online-dot.offline { background: var(--text-muted); }

        .conv-info { flex: 1; min-width: 0; }
        .conv-name { font-size: 0.92rem; font-weight: 600; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .conv-last-msg { font-size: 0.78rem; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .conv-last-msg.unread { color: var(--text-secondary); font-weight: 500; }

        .conv-meta { text-align: right; flex-shrink: 0; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
        .conv-time { font-size: 0.68rem; color: var(--text-muted); }

        .conv-unread {
            min-width: 20px; height: 20px; border-radius: 50px;
            background: var(--accent-purple); color: #fff;
            font-size: 0.65rem; font-weight: 700;
            display: flex; align-items: center; justify-content: center;
            padding: 0 5px;
        }

        .conv-typing { font-size: 0.78rem; color: var(--accent-green); font-style: italic; }

        /* Empty */
        .cs-empty {
            flex: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            color: var(--text-muted); padding: 30px;
        }

        .cs-empty .material-icons-round { font-size: 48px; margin-bottom: 12px; opacity: 0.3; }
        .cs-empty p { font-size: 0.88rem; text-align: center; }

        /* ============================== */
        /*  RIGHT PANEL — Chat Window     */
        /* ============================== */
        .chat-main {
            flex: 1; display: flex; flex-direction: column;
            height: 100vh; position: relative;
            background: var(--bg-primary);
        }

        /* No chat selected */
        .chat-empty {
            flex: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: center; color: var(--text-muted);
        }

        .chat-empty .empty-icon {
            width: 80px; height: 80px; border-radius: 50%;
            background: var(--bg-card); border: 1px solid var(--glass-border);
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 20px;
        }

        .chat-empty .empty-icon .material-icons-round { font-size: 36px; opacity: 0.4; }
        .chat-empty h2 { font-size: 1.2rem; font-weight: 700; color: var(--text-secondary); margin-bottom: 6px; }
        .chat-empty p { font-size: 0.88rem; }

        /* Chat Header */
        .chat-header {
            display: flex; align-items: center; gap: 14px;
            padding: 14px 24px;
            background: rgba(12,12,18,0.9);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--glass-border);
            flex-shrink: 0;
        }

        .chat-header .mobile-back {
            display: none; width: 36px; height: 36px; border-radius: 50%;
            background: var(--bg-card); border: 1px solid var(--glass-border);
            align-items: center; justify-content: center;
            cursor: pointer; color: var(--text-secondary);
            transition: var(--transition-fast);
        }

        .chat-header .mobile-back:hover { background: var(--bg-card-hover); color: var(--text-primary); }
        .chat-header .mobile-back .material-icons-round { font-size: 20px; }

        .ch-avatar {
            width: 42px; height: 42px; border-radius: 50%;
            background: var(--gradient-hero);
            display: flex; align-items: center; justify-content: center;
            font-size: 0.9rem; font-weight: 700; color: #fff;
            flex-shrink: 0; position: relative;
        }

        .ch-avatar .online-dot {
            position: absolute; bottom: 0; right: 0;
            width: 11px; height: 11px; border-radius: 50%;
            border: 2px solid rgba(12,12,18,0.9);
        }

        .ch-avatar .online-dot.online { background: var(--accent-green); }
        .ch-avatar .online-dot.offline { background: var(--text-muted); }

        .ch-info { flex: 1; }
        .ch-name { font-size: 0.95rem; font-weight: 700; }
        .ch-status { font-size: 0.75rem; color: var(--text-muted); }
        .ch-status.online { color: var(--accent-green); }
        .ch-status.typing { color: var(--accent-purple); font-style: italic; }

        .ch-actions { display: flex; gap: 6px; }

        .ch-btn {
            width: 38px; height: 38px; border-radius: 50%;
            background: var(--bg-card); border: 1px solid var(--glass-border);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: var(--transition-fast); color: var(--text-secondary);
        }

        .ch-btn:hover { background: var(--bg-card-hover); color: var(--text-primary); }
        .ch-btn .material-icons-round { font-size: 20px; }

        /* ============================== */
        /*  MESSAGES AREA                 */
        /* ============================== */
        .chat-messages {
            flex: 1; overflow-y: auto; padding: 20px 24px;
            display: flex; flex-direction: column; gap: 4px;
        }

        .chat-messages::-webkit-scrollbar { width: 4px; }
        .chat-messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.06); border-radius: 4px; }

        /* Date divider */
        .msg-date {
            text-align: center; margin: 16px 0;
        }

        .msg-date span {
            font-size: 0.7rem; font-weight: 600; color: var(--text-muted);
            background: var(--bg-card); padding: 4px 14px;
            border-radius: 20px; letter-spacing: 0.5px;
            border: 1px solid var(--glass-border);
        }

        /* Message bubble */
        .msg-row { display: flex; margin-bottom: 2px; }
        .msg-row.sent { justify-content: flex-end; }
        .msg-row.received { justify-content: flex-start; }

        .msg-bubble {
            max-width: 65%; padding: 10px 16px;
            border-radius: 18px; font-size: 0.9rem;
            line-height: 1.5; position: relative;
            word-wrap: break-word;
        }

        .msg-row.sent .msg-bubble {
            background: var(--msg-sent-bg);
            border: 1px solid var(--msg-sent-border);
            border-bottom-right-radius: 6px;
            color: var(--text-primary);
        }

        .msg-row.received .msg-bubble {
            background: var(--msg-recv-bg);
            border: 1px solid var(--msg-recv-border);
            border-bottom-left-radius: 6px;
            color: var(--text-primary);
        }

        .msg-meta {
            display: flex; align-items: center; gap: 4px;
            justify-content: flex-end; margin-top: 4px;
        }

        .msg-time { font-size: 0.65rem; color: var(--text-muted); }

        .msg-seen { font-size: 14px; }
        .msg-seen.seen { color: var(--accent-blue); }
        .msg-seen.delivered { color: var(--text-muted); }

        /* Typing indicator */
        .typing-indicator {
            display: none; padding: 4px 0;
        }

        .typing-indicator.visible { display: flex; }

        .typing-bubble {
            background: var(--msg-recv-bg); border: 1px solid var(--msg-recv-border);
            border-radius: 18px; border-bottom-left-radius: 6px;
            padding: 12px 18px; display: flex; gap: 5px; align-items: center;
        }

        .typing-dot {
            width: 7px; height: 7px; border-radius: 50%;
            background: var(--text-muted);
            animation: typingBounce 1.4s ease-in-out infinite;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typingBounce {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-6px); opacity: 1; }
        }

        /* ============================== */
        /*  MESSAGE INPUT                 */
        /* ============================== */
        .chat-input {
            padding: 14px 20px;
            background: rgba(12,12,18,0.9);
            backdrop-filter: blur(16px);
            border-top: 1px solid var(--glass-border);
            display: flex; align-items: flex-end; gap: 10px;
            flex-shrink: 0;
        }

        .emoji-btn {
            width: 40px; height: 40px; border-radius: 50%;
            background: none; border: none;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: var(--text-muted);
            transition: var(--transition-fast); flex-shrink: 0;
        }

        .emoji-btn:hover { color: var(--accent-orange); }
        .emoji-btn .material-icons-round { font-size: 24px; }

        .input-grow {
            flex: 1; position: relative;
        }

        .input-grow textarea {
            width: 100%; padding: 10px 16px;
            background: var(--bg-card); border: 1px solid var(--glass-border);
            border-radius: 22px; color: var(--text-primary);
            font-family: 'Inter', sans-serif; font-size: 0.9rem;
            outline: none; resize: none; min-height: 42px; max-height: 120px;
            line-height: 1.5; transition: var(--transition-fast);
        }

        .input-grow textarea::placeholder { color: var(--text-muted); }
        .input-grow textarea:focus { border-color: var(--accent-purple); box-shadow: 0 0 0 2px rgba(139,92,246,0.1); }

        .send-btn {
            width: 42px; height: 42px; border-radius: 50%;
            background: var(--gradient-hero); border: none;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: var(--transition-smooth);
            flex-shrink: 0; box-shadow: 0 2px 12px var(--accent-purple-glow);
        }

        .send-btn:hover { transform: scale(1.05); box-shadow: 0 4px 20px var(--accent-purple-glow); }
        .send-btn:active { transform: scale(0.95); }
        .send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
        .send-btn .material-icons-round { font-size: 20px; color: #fff; }

        /* ============================== */
        /*  EMOJI PICKER                  */
        /* ============================== */
        .emoji-picker {
            display: none; position: absolute; bottom: 56px; left: 0;
            width: 320px; max-height: 280px;
            background: rgba(18,18,26,0.97); backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border); border-radius: var(--radius-lg);
            box-shadow: 0 12px 40px rgba(0,0,0,0.5);
            overflow: hidden; z-index: 50;
        }

        .emoji-picker.visible { display: block; animation: fadeInUp 0.25s ease-out; }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .emoji-grid {
            display: grid; grid-template-columns: repeat(8, 1fr);
            gap: 2px; padding: 12px; max-height: 260px; overflow-y: auto;
        }

        .emoji-grid::-webkit-scrollbar { width: 4px; }
        .emoji-grid::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 4px; }

        .emoji-item {
            width: 100%; aspect-ratio: 1; border-radius: var(--radius-sm);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.3rem; cursor: pointer;
            transition: var(--transition-fast); border: none; background: none;
        }

        .emoji-item:hover { background: var(--bg-card-hover); transform: scale(1.15); }

        /* ============================== */
        /*  RESPONSIVE                    */
        /* ============================== */
        @media (max-width: 768px) {
            .chat-sidebar {
                position: absolute; left: 0; top: 0; z-index: 10;
                width: 100%;
            }

            .chat-sidebar.hidden { transform: translateX(-100%); }

            .chat-main.active { display: flex; }

            .chat-header .mobile-back { display: flex; }
        }

        @media (max-width: 480px) {
            .msg-bubble { max-width: 82%; }
            .chat-messages { padding: 16px; }
        }
    </style>
</head>
<body>

    <div class="chat-app">

        <!-- ============================== -->
        <!--  LEFT — Conversation List      -->
        <!-- ============================== -->
        <aside class="chat-sidebar" id="chat-sidebar">
            <div class="cs-header">
                <div class="cs-header-left">
                    <a href="dashboard.html" class="cs-back" title="Back to Dashboard">
                        <span class="material-icons-round">arrow_back</span>
                    </a>
                    <h1>Chats</h1>
                </div>
                <div class="cs-header-actions">
                    <button class="cs-action-btn" title="New Chat" id="btn-new-chat">
                        <span class="material-icons-round">edit_square</span>
                    </button>
                </div>
            </div>

            <div class="cs-search">
                <div class="cs-search-wrap">
                    <span class="material-icons-round">search</span>
                    <input type="text" id="chat-search" placeholder="Search conversations..." autocomplete="off">
                </div>
            </div>

            <div class="cs-list" id="conv-list">
                <div class="cs-empty" id="conv-empty">
                    <span class="material-icons-round">forum</span>
                    <p>No conversations yet.<br>Search friends and start chatting!</p>
                </div>
            </div>
        </aside>

        <!-- ============================== -->
        <!--  RIGHT — Chat Window           -->
        <!-- ============================== -->
        <section class="chat-main" id="chat-main">

            <!-- Empty state -->
            <div class="chat-empty" id="chat-empty-state">
                <div class="empty-icon">
                    <span class="material-icons-round">chat</span>
                </div>
                <h2>Select a Conversation</h2>
                <p>Choose a friend to start messaging</p>
            </div>

            <!-- Active chat (hidden until user selected) -->
            <div id="active-chat" style="display:none; flex-direction:column; height:100%;">

                <!-- Header -->
                <div class="chat-header">
                    <button class="mobile-back" id="mobile-back-btn">
                        <span class="material-icons-round">arrow_back</span>
                    </button>
                    <div class="ch-avatar" id="ch-avatar"><span>?</span>
                        <div class="online-dot offline" id="ch-online-dot"></div>
                    </div>
                    <div class="ch-info">
                        <div class="ch-name" id="ch-name">User</div>
                        <div class="ch-status" id="ch-status">Offline</div>
                    </div>
                    <div class="ch-actions">
                        <button class="ch-btn" id="btn-video-call" title="Video Call">
                            <span class="material-icons-round">videocam</span>
                        </button>
                        <button class="ch-btn" id="btn-voice-call" title="Voice Call">
                            <span class="material-icons-round">call</span>
                        </button>
                    </div>
                </div>

                <!-- Messages -->
                <div class="chat-messages" id="chat-messages">
                    <!-- Messages injected here -->
                </div>

                <!-- Typing indicator -->
                <div class="typing-indicator" id="typing-indicator">
                    <div style="padding: 0 24px;">
                        <div class="typing-bubble">
                            <div class="typing-dot"></div>
                            <div class="typing-dot"></div>
                            <div class="typing-dot"></div>
                        </div>
                    </div>
                </div>

                <!-- Input -->
                <div class="chat-input">
                    <button class="emoji-btn" id="emoji-toggle" title="Emoji">
                        <span class="material-icons-round">sentiment_satisfied_alt</span>
                    </button>
                    <div class="input-grow" style="position:relative;">
                        <textarea id="msg-input" rows="1" placeholder="Type a message..." maxlength="2000"></textarea>
                        <div class="emoji-picker" id="emoji-picker">
                            <div class="emoji-grid" id="emoji-grid"></div>
                        </div>
                    </div>
                    <button class="send-btn" id="send-btn" disabled title="Send">
                        <span class="material-icons-round">send</span>
                    </button>
                </div>

            </div>

        </section>
    </div>

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script>
        /* ============================== */
        /*  CONFIG & AUTH                 */
        /* ============================== */
        var APP_CONFIG = {
            API_BASE: window.location.origin,
            TOKEN_KEY: 'missvoice_token',
            USER_KEY: 'missvoice_user'
        };

        var AuthManager = {
            getToken: function() { return localStorage.getItem(APP_CONFIG.TOKEN_KEY); },
            getUser: function() { var d = localStorage.getItem(APP_CONFIG.USER_KEY); return d ? JSON.parse(d) : null; },
            isLoggedIn: function() { return !!this.getToken(); },
            authHeaders: function() { var t = this.getToken(); return { 'Content-Type': 'application/json', 'Authorization': t ? 'Bearer ' + t : '' }; },
            logout: function() { localStorage.removeItem(APP_CONFIG.TOKEN_KEY); localStorage.removeItem(APP_CONFIG.USER_KEY); window.location.href = 'login.html'; }
        };

        if (!AuthManager.isLoggedIn()) { window.location.href = 'login.html'; }

        var currentUser = AuthManager.getUser();
        var activeChatUserId = null;
        var activeChatUser = null;
        var conversations = [];
        var typingTimer = null;
        var isTyping = false;

        /* ============================== */
        /*  SOCKET CONNECTION             */
        /* ============================== */
        var socket = io(APP_CONFIG.API_BASE, {
            auth: { token: AuthManager.getToken() },
            transports: ['websocket', 'polling']
        });

        socket.on('connect', function() {
            console.log('Socket connected:', socket.id);
        });

        socket.on('connect_error', function(err) {
            console.error('Socket error:', err.message);
        });

        /* ============================== */
        /*  DOM ELEMENTS                  */
        /* ============================== */
        var convList = document.getElementById('conv-list');
        var convEmpty = document.getElementById('conv-empty');
        var chatEmptyState = document.getElementById('chat-empty-state');
        var activeChat = document.getElementById('active-chat');
        var chatMessages = document.getElementById('chat-messages');
        var msgInput = document.getElementById('msg-input');
        var sendBtn = document.getElementById('send-btn');
        var typingIndicator = document.getElementById('typing-indicator');
        var chatSidebar = document.getElementById('chat-sidebar');

        /* ============================== */
        /*  EMOJI PICKER                  */
        /* ============================== */
        var emojis = [
            '😀','😂','🥰','😍','😎','🤩','😊','😋','😜','🤔','😏','😢',
            '😭','😤','🥺','😱','🤗','🙄','😴','🤮','👍','👎','👋','🤝',
            '❤️','🧡','💛','💚','💙','💜','🖤','💯','🔥','⭐','✨','🎉',
            '🎊','💪','🙏','👏','🤞','✌️','🤟','👀','💬','📞','📱','💻',
            '🎵','🌍','☀️','🌙','⚡','🌈','🦋','🌺','🍕','☕','🎮','⚽'
        ];

        var emojiGrid = document.getElementById('emoji-grid');
        emojis.forEach(function(e) {
            var btn = document.createElement('button');
            btn.className = 'emoji-item';
            btn.textContent = e;
            btn.type = 'button';
            btn.addEventListener('click', function() {
                msgInput.value += e;
                msgInput.focus();
                sendBtn.disabled = false;
            });
            emojiGrid.appendChild(btn);
        });

        var emojiPicker = document.getElementById('emoji-picker');
        document.getElementById('emoji-toggle').addEventListener('click', function(e) {
            e.stopPropagation();
            emojiPicker.classList.toggle('visible');
        });

        document.addEventListener('click', function(e) {
            if (!emojiPicker.contains(e.target)) emojiPicker.classList.remove('visible');
        });

        /* ============================== */
        /*  AUTO-RESIZE TEXTAREA          */
        /* ============================== */
        msgInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 120) + 'px';
            sendBtn.disabled = this.value.trim().length === 0;

            /* Typing indicator */
            if (!isTyping && activeChatUserId) {
                isTyping = true;
                socket.emit('typing', { receiver_id: activeChatUserId, sender_id: currentUser.id });
            }
            clearTimeout(typingTimer);
            typingTimer = setTimeout(function() {
                isTyping = false;
                socket.emit('stop_typing', { receiver_id: activeChatUserId, sender_id: currentUser.id });
            }, 1500);
        });

        /* Send on Enter (Shift+Enter for newline) */
        msgInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                if (!sendBtn.disabled) sendMessage();
            }
        });

        /* ============================== */
        /*  LOAD CONVERSATIONS            */
        /* ============================== */
        function loadConversations() {
            fetch(APP_CONFIG.API_BASE + '/api/chat/recent', { headers: AuthManager.authHeaders() })
            .then(function(r) { return r.json(); })
            .then(function(data) {
                conversations = data.conversations || [];
                renderConversations(conversations);
            }).catch(function() {});
        }

        function renderConversations(list) {
            if (list.length === 0) {
                convEmpty.style.display = 'flex';
                return;
            }
            convEmpty.style.display = 'none';

            var html = list.map(function(c) {
                var initials = (c.display_name || c.username || 'U').charAt(0).toUpperCase();
                var time = c.last_message_time ? formatTime(new Date(c.last_message_time)) : '';
                var isActive = activeChatUserId == c.user_id;
                var unreadHtml = c.unread_count > 0 ? '<div class="conv-unread">' + c.unread_count + '</div>' : '';
                var lastMsgClass = c.unread_count > 0 ? 'conv-last-msg unread' : 'conv-last-msg';

                return '<div class="conv-item' + (isActive ? ' active' : '') + '" onclick="openChat(' + c.user_id + ')" data-uid="' + c.user_id + '">' +
                    '<div class="conv-avatar">' + initials +
                    '<div class="online-dot ' + (c.is_online ? 'online' : 'offline') + '"></div></div>' +
                    '<div class="conv-info"><div class="conv-name">' + (c.display_name || c.username) + '</div>' +
                    '<div class="' + lastMsgClass + '">' + (c.last_message || 'Start chatting') + '</div></div>' +
                    '<div class="conv-meta"><div class="conv-time">' + time + '</div>' + unreadHtml + '</div></div>';
            }).join('');

            /* Keep only conv items, preserve empty */
            var existingItems = convList.querySelectorAll('.conv-item');
            existingItems.forEach(function(el) { el.remove(); });
            convList.insertAdjacentHTML('afterbegin', html);
        }

        function formatTime(date) {
            var now = new Date();
            var diff = now - date;
            if (diff < 86400000 && now.getDate() === date.getDate()) {
                return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            } else if (diff < 172800000) {
                return 'Yesterday';
            }
            return date.toLocaleDateString([], { month: 'short', day: 'numeric' });
        }

        /* ============================== */
        /*  OPEN CHAT                     */
        /* ============================== */
        function openChat(userId) {
            activeChatUserId = userId;

            chatEmptyState.style.display = 'none';
            activeChat.style.display = 'flex';

            /* Mobile: hide sidebar */
            chatSidebar.classList.add('hidden');

            /* Update active state in list */
            document.querySelectorAll('.conv-item').forEach(function(el) {
                el.classList.toggle('active', el.getAttribute('data-uid') == userId);
            });

            /* Fetch user info */
            fetch(APP_CONFIG.API_BASE + '/api/users/' + userId, { headers: AuthManager.authHeaders() })
            .then(function(r) { return r.json(); })
            .then(function(user) {
                activeChatUser = user;
                var initials = (user.display_name || user.username || 'U').charAt(0).toUpperCase();
                document.getElementById('ch-avatar').querySelector('span').textContent = initials;
                document.getElementById('ch-name').textContent = user.display_name || user.username;

                var dot = document.getElementById('ch-online-dot');
                var status = document.getElementById('ch-status');
                dot.className = 'online-dot ' + (user.is_online ? 'online' : 'offline');
                status.textContent = user.is_online ? 'Online' : 'Offline';
                status.className = 'ch-status' + (user.is_online ? ' online' : '');
            }).catch(function() {});

            /* Load messages */
            loadMessages(userId);
        }

        /* ============================== */
        /*  LOAD MESSAGES                 */
        /* ============================== */
        function loadMessages(userId) {
            fetch(APP_CONFIG.API_BASE + '/api/chat/messages/' + userId, { headers: AuthManager.authHeaders() })
            .then(function(r) { return r.json(); })
            .then(function(data) {
                var messages = data.messages || [];
                renderMessages(messages);
                scrollToBottom();

                /* Mark as seen */
                messages.forEach(function(m) {
                    if (m.sender_id == userId && !m.is_seen) {
                        socket.emit('message_seen', { message_id: m.id, sender_id: userId });
                    }
                });
            }).catch(function() {});
        }

        function renderMessages(messages) {
            var html = '';
            var lastDate = '';

            messages.forEach(function(m) {
                var msgDate = new Date(m.created_at).toLocaleDateString();
                if (msgDate !== lastDate) {
                    lastDate = msgDate;
                    var today = new Date().toLocaleDateString();
                    var yesterday = new Date(Date.now() - 86400000).toLocaleDateString();
                    var label = msgDate === today ? 'Today' : msgDate === yesterday ? 'Yesterday' : msgDate;
                    html += '<div class="msg-date"><span>' + label + '</span></div>';
                }

                var isSent = m.sender_id == currentUser.id;
                var time = new Date(m.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                var seenIcon = '';
                if (isSent) {
                    seenIcon = m.is_seen
                        ? '<span class="material-icons-round msg-seen seen">done_all</span>'
                        : '<span class="material-icons-round msg-seen delivered">done_all</span>';
                }

                html += '<div class="msg-row ' + (isSent ? 'sent' : 'received') + '">' +
                    '<div class="msg-bubble">' +
                    '<div class="msg-text">' + escapeHtml(m.content) + '</div>' +
                    '<div class="msg-meta"><span class="msg-time">' + time + '</span>' + seenIcon + '</div>' +
                    '</div></div>';
            });

            chatMessages.innerHTML = html;
        }

        function escapeHtml(text) {
            var div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function scrollToBottom() {
            setTimeout(function() {
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }, 50);
        }

        /* ============================== */
        /*  SEND MESSAGE                  */
        /* ============================== */
        sendBtn.addEventListener('click', sendMessage);

        function sendMessage() {
            var content = msgInput.value.trim();
            if (!content || !activeChatUserId) return;

            /* Emit to socket */
            socket.emit('send_message', {
                receiver_id: activeChatUserId,
                content: content,
                msg_type: 'text'
            });

            /* Optimistic UI */
            var now = new Date();
            var time = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            var msgHtml = '<div class="msg-row sent">' +
                '<div class="msg-bubble">' +
                '<div class="msg-text">' + escapeHtml(content) + '</div>' +
                '<div class="msg-meta"><span class="msg-time">' + time + '</span>' +
                '<span class="material-icons-round msg-seen delivered">done_all</span></div>' +
                '</div></div>';

            chatMessages.insertAdjacentHTML('beforeend', msgHtml);
            scrollToBottom();

            msgInput.value = '';
            msgInput.style.height = 'auto';
            sendBtn.disabled = true;

            /* Stop typing */
            isTyping = false;
            socket.emit('stop_typing', { receiver_id: activeChatUserId, sender_id: currentUser.id });
        }

        /* ============================== */
        /*  SOCKET EVENTS                 */
        /* ============================== */
        socket.on('new_message', function(msg) {
            if (msg.sender_id == activeChatUserId) {
                var time = new Date(msg.created_at || Date.now()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                var msgHtml = '<div class="msg-row received">' +
                    '<div class="msg-bubble"><div class="msg-text">' + escapeHtml(msg.content) + '</div>' +
                    '<div class="msg-meta"><span class="msg-time">' + time + '</span></div></div></div>';
                chatMessages.insertAdjacentHTML('beforeend', msgHtml);
                scrollToBottom();

                /* Mark as seen */
                socket.emit('message_seen', { message_id: msg.id, sender_id: msg.sender_id });

                /* Hide typing */
                typingIndicator.classList.remove('visible');
            }

            /* Update conversation list */
            loadConversations();
        });

        socket.on('typing', function(data) {
            if (data.sender_id == activeChatUserId) {
                typingIndicator.classList.add('visible');
                var status = document.getElementById('ch-status');
                status.textContent = 'typing...';
                status.className = 'ch-status typing';
            }
        });

        socket.on('stop_typing', function(data) {
            if (data.sender_id == activeChatUserId) {
                typingIndicator.classList.remove('visible');
                var status = document.getElementById('ch-status');
                status.textContent = activeChatUser && activeChatUser.is_online ? 'Online' : 'Offline';
                status.className = 'ch-status' + (activeChatUser && activeChatUser.is_online ? ' online' : '');
            }
        });

        socket.on('seen_update', function(data) {
            /* Update seen icons */
            var seenIcons = chatMessages.querySelectorAll('.msg-seen.delivered');
            seenIcons.forEach(function(icon) {
                icon.classList.remove('delivered');
                icon.classList.add('seen');
            });
        });

        socket.on('user_online', function(data) {
            if (data.user_id == activeChatUserId) {
                document.getElementById('ch-online-dot').className = 'online-dot online';
                var s = document.getElementById('ch-status');
                s.textContent = 'Online'; s.className = 'ch-status online';
            }
            /* Update conv list dots */
            var convItem = document.querySelector('.conv-item[data-uid="' + data.user_id + '"] .online-dot');
            if (convItem) { convItem.className = 'online-dot online'; }
        });

        socket.on('user_offline', function(data) {
            if (data.user_id == activeChatUserId) {
                document.getElementById('ch-online-dot').className = 'online-dot offline';
                var s = document.getElementById('ch-status');
                s.textContent = 'Offline'; s.className = 'ch-status';
            }
            var convItem = document.querySelector('.conv-item[data-uid="' + data.user_id + '"] .online-dot');
            if (convItem) { convItem.className = 'online-dot offline'; }
        });

        /* ============================== */
        /*  SEARCH CONVERSATIONS          */
        /* ============================== */
        document.getElementById('chat-search').addEventListener('input', function() {
            var q = this.value.trim().toLowerCase();
            if (!q) { renderConversations(conversations); return; }
            var filtered = conversations.filter(function(c) {
                return (c.display_name || c.username || '').toLowerCase().indexOf(q) !== -1;
            });
            renderConversations(filtered);
        });

        /* ============================== */
        /*  MOBILE BACK                   */
        /* ============================== */
        document.getElementById('mobile-back-btn').addEventListener('click', function() {
            chatSidebar.classList.remove('hidden');
            activeChat.style.display = 'none';
            chatEmptyState.style.display = 'flex';
        });

        /* ============================== */
        /*  VIDEO CALL BUTTON             */
        /* ============================== */
        document.getElementById('btn-video-call').addEventListener('click', function() {
            if (activeChatUserId) {
                window.location.href = 'call.html?user=' + activeChatUserId;
            }
        });

        /* ============================== */
        /*  URL PARAMS — Open specific    */
        /* ============================== */
        var urlParams = new URLSearchParams(window.location.search);
        var targetUser = urlParams.get('user');

        loadConversations();

        if (targetUser) {
            setTimeout(function() { openChat(parseInt(targetUser)); }, 300);
        }
    </script>
</body>
</html>
