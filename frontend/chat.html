<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MissVoice Chat</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI,sans-serif}
body{background:linear-gradient(135deg,#081428,#162b55);color:#fff;height:100vh;display:flex;justify-content:center;align-items:center}
.chat{width:95%;max-width:950px;height:90vh;background:rgba(255,255,255,.08);border-radius:18px;display:flex;flex-direction:column;overflow:hidden}
.header{display:flex;align-items:center;justify-content:space-between;padding:15px 20px;background:rgba(255,255,255,.08)}
.left{display:flex;align-items:center;gap:12px}.avatar{width:50px;height:50px;border-radius:50%;background:#39d8ff;color:#000;display:flex;align-items:center;justify-content:center;font-weight:bold}
.actions button,.send{padding:10px 15px;border:none;border-radius:20px;background:#39d8ff;cursor:pointer;font-weight:bold}
.messages{flex:1;padding:20px;overflow:auto}
.msg{max-width:70%;padding:10px 14px;border-radius:12px;margin:10px 0}
.me{background:#39d8ff;color:#000;margin-left:auto}
.other{background:#223d73}
.bottom{display:flex;gap:10px;padding:15px;background:rgba(255,255,255,.08)}
.bottom input{flex:1;padding:12px;border:none;border-radius:25px}
</style></head><body>
<div class="chat">
<div class="header">
<div class="left"><div class="avatar">U</div><div><h3>Username</h3><small>Offline</small></div></div>
<div class="actions">
<button onclick="location.href='dashboard.html'">⬅ Dashboard</button>
<button onclick="location.href='videocall.html'">📹 Call</button>
<button onclick="clearChat()">🗑 Clear</button>
</div></div>
<div class="messages" id="messages">
<div class="msg other">No messages yet. Start the conversation.</div>
</div>
<div class="bottom">
<input id="text" placeholder="Type a message...">
<button class="send" onclick="sendMsg()">Send</button>
</div></div>
<script>
function sendMsg(){
const t=document.getElementById('text');
if(!t.value.trim())return;
const box=document.getElementById('messages');
if(box.children.length==1 && box.firstElementChild.textContent.includes('No messages')) box.innerHTML='';
const d=document.createElement('div');
d.className='msg me';
d.textContent=t.value;
box.appendChild(d);
box.scrollTop=box.scrollHeight;
t.value='';
}
function clearChat(){
if(confirm('Clear all messages?')){
document.getElementById('messages').innerHTML='<div class="msg other">No messages yet. Start the conversation.</div>';
}}
document.getElementById('text').addEventListener('keypress',e=>{if(e.key==="Enter")sendMsg();});
</script>
</body></html>
